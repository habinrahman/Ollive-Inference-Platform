apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - api.yaml
  - frontend.yaml
  - dashboard.yaml
  - ingress.yaml

images:
  - name: ollive-api
    newName: ollive-api
    newTag: latest
  - name: ollive-frontend
    newName: ollive-frontend
    newTag: latest
  - name: ollive-dashboard
    newName: ollive-dashboard
    newTag: latest
