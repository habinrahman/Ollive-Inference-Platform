apiVersion: v1
kind: Service
metadata:
  name: ollive-api
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive-api
    app.kubernetes.io/part-of: ollive-inference-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: ollive-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-api
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive-api
    app.kubernetes.io/part-of: ollive-inference-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ollive-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollive-api
        app.kubernetes.io/part-of: ollive-inference-platform
    spec:
      containers:
        - name: api
          image: ollive-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ollive-config
            - secretRef:
                name: ollive-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
