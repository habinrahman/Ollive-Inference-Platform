apiVersion: v1
kind: Secret
metadata:
  name: ollive-secrets
  namespace: ollive
  labels:
    app.kubernetes.io/part-of: ollive-inference-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@ollive-postgres:5432/ollive"
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ollive-postgres-secret
  namespace: ollive
  labels:
    app.kubernetes.io/part-of: ollive-inference-platform
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "ollive"
