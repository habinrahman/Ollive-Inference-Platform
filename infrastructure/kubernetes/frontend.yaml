apiVersion: v1
kind: Service
metadata:
  name: ollive-frontend
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive-frontend
    app.kubernetes.io/part-of: ollive-inference-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/name: ollive-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-frontend
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive-frontend
    app.kubernetes.io/part-of: ollive-inference-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ollive-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollive-frontend
        app.kubernetes.io/part-of: ollive-inference-platform
    spec:
      containers:
        - name: frontend
          image: ollive-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ollive-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
