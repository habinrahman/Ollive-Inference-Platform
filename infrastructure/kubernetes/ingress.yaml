apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollive-ingress
  namespace: ollive
  labels:
    app.kubernetes.io/part-of: ollive-inference-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: api.ollive.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollive-api
                port:
                  number: 8000
    - host: chat.ollive.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollive-frontend
                port:
                  number: 3000
    - host: dashboard.ollive.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollive-dashboard
                port:
                  number: 3000
