apiVersion: v1
kind: Service
metadata:
  name: ollive-postgres
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive-postgres
    app.kubernetes.io/part-of: ollive-inference-platform
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: ollive-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollive-postgres
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive-postgres
    app.kubernetes.io/part-of: ollive-inference-platform
spec:
  serviceName: ollive-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollive-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollive-postgres
        app.kubernetes.io/part-of: ollive-inference-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: ollive-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
